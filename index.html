<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BearSec</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/cli.css">
</head>

<body data-page="home" data-prefixo="">
  <div id="app">
    <header id="site-header"></header>
    <aside id="site-sidebar"></aside>

    <main id="site-content">
      <h1>Home</h1>
      <p>Conteúdo da página. Substitua este parágrafo pelo seu texto.</p>
      <p>Para criar uma nova página, copie este arquivo, ajuste o <code>data-page</code> e escreva seu conteúdo aqui.
      </p>

      <!-- Inicio do terminal -->
      <div class="terminal-card">
        <div class="terminal-bar">
          <div class="t-dot red"></div>
          <div class="t-dot yellow"></div>
          <div class="t-dot green"></div>
          <span class="t-title">root@bearsec-box:~</span>
          <div class="t-controls">
            <button class="t-btn" title="Minimize">−</button>
            <button class="t-btn" title="Maximize">□</button>
            <button class="t-btn" title="Close">×</button>
          </div>
        </div>
        <div class="terminal-body" id="term-body">
          <div class="t-line">Welcome to BearSecOS v1.0.1</div>
          <div class="t-line dim">Type "help" for available commands.</div>
          <div id="term-output"></div>
          <div class="t-prompt">
            <span class="t-arrow">➜</span>
            <input type="text" id="term-input" placeholder="~ " autocomplete="off" spellcheck="false">
          </div>
        </div>
      </div>
      <!-- Fim do terminal -->

    </main>
    <footer id="site-footer"></footer>
  </div>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/cli.js"></script>
</body>

</html>
